services:
  api:
    build: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: sqlite:////app/data/psx_predictor.db
      CORS_ORIGINS: http://localhost:4173,http://localhost:5173
      APP_ENV: production
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in your deployment environment}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (at least 32 random characters)}
      ENABLE_SCHEDULER: "true"
    volumes:
      - psx-data:/app/data
      - psx-models:/app/models
      - psx-reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "4173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  psx-data:
  psx-models:
  psx-reports:
